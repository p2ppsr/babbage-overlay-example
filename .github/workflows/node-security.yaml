name: Node security qualification
on:
  pull_request:
  push:
    branches: [master, main, production]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      - name: Check JavaScript and shell syntax
        run: |
          set -euo pipefail
          find src scripts -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
  linux-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build frozen Linux image and verify patched native runtime
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --tag node-security-qualification .
          docker run --rm --network none --entrypoint node node-security-qualification -e "const a=require('node:assert/strict'),z=require('node:zlib');a.equal(process.version,'v22.23.4');a.equal(process.arch,'x64');a.equal(process.platform,'linux');a.equal(z.brotliDecompressSync(z.brotliCompressSync(Buffer.from('security'))).toString(),'security');require('node:crypto').randomBytes(16);console.log(JSON.stringify({node:process.version,arch:process.arch,platform:process.platform,brotli:true,crypto:true}))"
